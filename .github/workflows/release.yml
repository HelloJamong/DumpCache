name: Release and Deploy

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: get_version
        run: |
          # 태그명 == 버전 (예: 26.1.0), 접두사 없음
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$VERSION" >> $GITHUB_OUTPUT

      - name: Extract release notes from CHANGELOG
        id: changelog
        run: |
          VERSION=${{ steps.get_version.outputs.version }}

          # CHANGELOG.md에서 해당 버전 헤더 다음 줄부터 다음 "## [" 헤더 전까지 추출
          RELEASE_NOTES=$(awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md)

          # GitHub Actions 멀티라인 출력
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$RELEASE_NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            igor0670/dumpcache:latest
            igor0670/dumpcache:${{ steps.get_version.outputs.tag }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: Release ${{ steps.get_version.outputs.tag }}
          body: |
            ## 🎉 DumpCache ${{ steps.get_version.outputs.tag }}

            ${{ steps.changelog.outputs.notes }}

            ---

            ### 📦 Docker Image

            ```bash
            docker pull igor0670/dumpcache:${{ steps.get_version.outputs.tag }}
            docker pull igor0670/dumpcache:latest
            ```

            ### 🚀 Quick Start

            ```bash
            # 필요한 파일 다운로드
            curl -L -O https://github.com/HelloJamong/DumpCache/releases/download/${{ steps.get_version.outputs.tag }}/docker-compose.yml
            curl -L -O https://github.com/HelloJamong/DumpCache/releases/download/${{ steps.get_version.outputs.tag }}/default.env.example

            # 데이터 디렉토리 생성
            mkdir -p data/images

            # .env 파일 생성 및 설정
            cp default.env.example .env
            nano .env  # 또는 vi .env

            # 실행
            docker compose up -d

            # 로그 확인
            docker compose logs -f
            ```
          files: |
            docker-compose.yml
            default.env.example
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
